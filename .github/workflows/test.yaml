name: test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 16 * *'
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, diagnostics=${{ matrix.diagnostics }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
        diagnostics:
          - 'false'
          - 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The server runs in its own network namespace, so the tunnel between the
      # runner and the container is a real one. wireguard-tools stays out of the
      # host, leaving the action to do its own install.
      - name: Start the WireGuard server
        run: |
          # The container creates its wireguard link with CAP_NET_ADMIN only, so
          # make sure the host has the module loaded rather than relying on the
          # kernel autoloading it on the container's behalf.
          sudo modprobe wireguard

          # SERVERURL has to be set before the container starts, so pin the
          # address with a dedicated network rather than discovering it after.
          docker network create --subnet 172.28.0.0/24 wgnet

          # lscr.io proxies to ghcr.io through shared infrastructure with a
          # rate limit to match, and a separate pull keeps its errors legible.
          docker pull ghcr.io/linuxserver/wireguard:latest

          # ALLOWEDIPS is deliberately narrow. With the default 0.0.0.0/0 the
          # runner would push all its traffic - including its connection to
          # GitHub - into the tunnel, and the job would hang.
          docker run -d --name wg-server \
            --network wgnet --ip 172.28.0.10 \
            --cap-add NET_ADMIN --cap-add SYS_MODULE \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -e PEERS=1 \
            -e SERVERURL=172.28.0.10 \
            -e SERVERPORT=51820 \
            -e ALLOWEDIPS=10.13.13.0/24 \
            -e LOG_CONFS=false \
            ghcr.io/linuxserver/wireguard:latest

      - name: Take the client config the server generated
        run: |
          # The image generates the peer conf during first start. Wait for the
          # server interface to be listening AND for the conf to be finished -
          # AllowedIPs is its last line - so a partial read can never happen.
          for _ in $(seq 60); do
            if docker exec wg-server wg show wg0 > /dev/null 2>&1 &&
              docker exec wg-server grep -q '^AllowedIPs' /config/peer1/peer1.conf 2> /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ -z "${ready:-}" ]; then
            echo '::error::the server did not become ready in time'
            docker logs wg-server
            exit 1
          fi

          # Drop the DNS line. wg-quick would hand it to resolvconf and repoint
          # the runner's own resolver at the container, so any hiccup in there
          # would break every later step in a way that looks unrelated.
          conf=$(docker exec wg-server sed '/^DNS/d' /config/peer1/peer1.conf)

          # Keep the secret-class fields out of the log.
          echo "::add-mask::$(printf '%s' "$conf" | awk '/^PrivateKey/ {print $3}')"
          echo "::add-mask::$(printf '%s' "$conf" | awk '/^PresharedKey/ {print $3}')"

          {
            echo 'WG_CLIENT_CONF<<WGEOF'
            printf '%s\n' "$conf"
            echo 'WGEOF'
          } >> "$GITHUB_ENV"

      - name: Connect to vpn using this action
        uses: ./
        with:
          config: ${{ env.WG_CLIENT_CONF }}
          diagnostics: ${{ matrix.diagnostics }}

      - name: Assert the interface came up
        run: |
          ip link show wg-github
          test "$(sudo stat -c '%a' /etc/wireguard/wg-github.conf)" = '600'

          # Both ends must agree on the client's identity.
          client_pub=$(sudo wg show wg-github public-key)
          docker exec wg-server wg show wg0 peers | grep -qxF "$client_pub"
          echo 'interface, config permissions and peer identity all correct'

      - name: Assert traffic crosses the tunnel
        run: |
          ping -c 3 -W 5 10.13.13.1

          sudo wg show wg-github

          # `wg show <if> dump` is the documented machine-readable form: line 1 is
          # the interface, lines 2+ are peers, tab separated, with the fields
          # public-key, preshared-key, endpoint, allowed-ips, latest-handshake,
          # transfer-rx, transfer-tx, persistent-keepalive.
          peer=$(sudo wg show wg-github dump | sed -n '2p')
          handshake=$(printf '%s' "$peer" | cut -f5)
          received=$(printf '%s' "$peer" | cut -f6)

          if [ "${handshake:-0}" -eq 0 ]; then
            echo '::error::no handshake with the server'
            exit 1
          fi

          if [ "${received:-0}" -eq 0 ]; then
            echo '::error::nothing was received from the server'
            exit 1
          fi
          echo "handshake completed, ${received} bytes received"

      - name: Show the server side
        if: always()
        run: docker exec wg-server wg show

      - name: Remove the docker container
        if: always()
        run: |
          docker rm -f wg-server
          docker network rm wgnet || echo 'network already gone'
