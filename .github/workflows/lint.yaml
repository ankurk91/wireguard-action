name: lint

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 16 * *'
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run the sh-checker
        uses: luizm/action-sh-checker@v0.10.0
        with:
          sh_checker_checkbashisms_enable: true
          sh_checker_shfmt_disable: true

      - name: Check the JavaScript entry points parse
        run: |
          for file in src/*.mjs; do
            node --check "$file"
          done
